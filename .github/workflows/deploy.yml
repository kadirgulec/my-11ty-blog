name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

# The CMS saves each post as its own commit, so a batch of edits can queue several
# deploys at once. They all sync against the same remote state file, and a delete
# from one run then hits a path another run already removed. Queue them instead;
# never cancel a running deploy, or it stops before writing back the state file.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  # Build once and hand the same _site/ to every server, so both always serve
  # identical output and the image pipeline only runs a single time.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Site
        run: npm run build

      - name: 📤 Upload build
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./_site/
          # Without this the artifact silently drops .htaccess.
          include-hidden-files: true
          retention-days: 1

  deploy-hetzner:
    name: 🎉 Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download build
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./_site/

      - name: 📂 Sync files to Hetzner
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./_site/
          server-dir: ./public_html/my-11ty-blog/

          protocol: ftps
          security: strict

  deploy-hestia:
    name: ☁️ Deploy to HestiaCP
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download build
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./_site/

      - name: 🔑 Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HESTIA_PORT || 22 }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts

      # .well-known is left alone so Let's Encrypt challenges keep working.
      - name: 📂 Sync files to HestiaCP
        run: |
          rsync -rlptvz --delete \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HESTIA_PORT || 22 }}" \
            ./_site/ "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}:${{ secrets.HESTIA_PATH }}/"
