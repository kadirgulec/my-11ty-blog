name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

# The CMS saves each post as its own commit, so a batch of edits can queue several
# deploys at once. Queue them instead of running them side by side, so two rsyncs
# never write into public_html at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ☁️ Deploy to HestiaCP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Site
        run: npm run build

      - name: 🔑 Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HESTIA_PORT || 22 }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts

      # .well-known is left alone so Let's Encrypt challenges keep working.
      - name: 📂 Sync files to HestiaCP
        run: |
          rsync -rlptvz --delete \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HESTIA_PORT || 22 }}" \
            ./_site/ "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}:${{ secrets.HESTIA_PATH }}/"
