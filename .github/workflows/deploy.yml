name: Deploy to Hetzner

on:
  push:
    branches:
      - master

# The CMS saves each post as its own commit, so a batch of edits can queue several
# deploys at once. They all sync against the same remote state file, and a delete
# from one run then hits a path another run already removed. Queue them instead;
# never cancel a running deploy, or it stops before writing back the state file.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Site
        run: npm run build

      - name: 📂 Sync files to Hetzner
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          local-dir: ./_site/
          server-dir: ./public_html/my-11ty-blog/

          protocol: ftps
          security: strict
